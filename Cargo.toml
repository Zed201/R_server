[package]
name = "r_server"
version = "1.5.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
clap = { version = "4.5.18", features = ["derive"] }
colored = "2.1.0"
colorize = "0.1.0"
http-body-util = "0.1.2"
hyper = { version = "1.5.1", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["full"] }
log = "0.4.22"
maud = "0.26.0"
once_cell = "1.20.2"
tokio = { version = "1.42.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-service = "0.3.3"
tungstenite = "0.24.0"
url = "2.5.2"

[profile.release]
debug = true
