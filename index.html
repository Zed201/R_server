<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: cyan;
            color: red;
        }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: red;
        }
        .success-message {
            color: green;
            display: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="titulo-principal">Formulário de Teste</h1>
        <h1>ab</h1> 
        <form id="formulario-teste">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="18" max="100">
            </div>

            <div class="form-group">
                <label>Gênero:</label>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label>
                <input type="radio" id="feminino" name="genero" value="feminino">
                <label for="feminino">Feminino</label>
            </div>

            <div class="form-group">
                <label for="interesses">Interesses:</label>
                <select id="interesses" name="interesses" multiple>
                    <option value="tecnologia">Tecnologia</option>
                    <option value="esportes">Esportes</option>
                    <option value="musica">Música</option>
                    <option value="cinema">Cinema</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="4"></textarea>
            </div>

            <div class="form-group">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os termos e condições</label>
            </div>

            <button type="submit" id="botao-enviar">Enviar</button>
        </form>

        <p id="mensagem-sucesso" class="success-message">Formulário enviado com sucesso!</p>
    </div>

    <script>
        document.getElementById('formulario-teste').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('mensagem-sucesso').style.display = 'block';
        });
    </script>
</body>
</html>
